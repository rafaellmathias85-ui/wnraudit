name: Deploy VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Preservar .env antes do checkout
        run: |
          ENV="$GITHUB_WORKSPACE/source/.env"
          if [ -f "$ENV" ]; then
            cp "$ENV" "$HOME/.wnraudit-env.bak"
          fi

      - name: Remover git locks residuais
        run: |
          find "$GITHUB_WORKSPACE" -name "*.lock" -path "*/.git/*" -delete 2>/dev/null || true

      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Restaurar .env apos checkout
        run: |
          BAK="$HOME/.wnraudit-env.bak"
          DEST="$GITHUB_WORKSPACE/source/.env"
          if [ -f "$BAK" ]; then
            cp "$BAK" "$DEST"
          fi

      - name: Deploy
        env:
          APP_SOURCE: ${{ github.workspace }}/source
        run: bash "${{ github.workspace }}/deploy.sh"
