name: Deploy VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy on VPS
        run: |
          APP_ROOT="/var/www/wnraudit"
          APP_DIR="$APP_ROOT/app"
          DEPLOY_USER="$(id -un)"
          DEPLOY_GROUP="$(id -gn)"

          sudo mkdir -p "$APP_DIR"
          sudo chown -R "$DEPLOY_USER:$DEPLOY_GROUP" "$APP_ROOT"
          cd "$APP_DIR"

          if [ ! -d ".git" ]; then
            git clone https://github.com/rafaellmathias85-ui/wnraudit.git .
          fi

          # PRESERVAR source/.env antes do git reset
          if [ -f "source/.env" ]; then
            cp source/.env "$APP_ROOT/.env.backup"
          fi

          git config --global --add safe.directory "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main

          # RESTAURAR source/.env apos git reset
          if [ -f "$APP_ROOT/.env.backup" ]; then
            cp "$APP_ROOT/.env.backup" source/.env
          fi

          if [ -f "deploy.sh" ]; then
            cp deploy.sh "$APP_ROOT/deploy.sh"
            chmod +x "$APP_ROOT/deploy.sh"
          fi

          if [ -f "$APP_ROOT/deploy.sh" ]; then
            bash "$APP_ROOT/deploy.sh"
          else
            echo "ERRO: deploy.sh nao encontrado!"
            exit 1
          fi
