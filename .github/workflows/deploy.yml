name: Deploy VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy on VPS
        run: |
          sudo mkdir -p /var/www/audit/app
          sudo chown -R ubuntu:ubuntu /var/www/audit
          cd /var/www/audit/app

          if [ ! -d ".git" ]; then
            git clone https://github.com/rafaellmathias85-ui/wnraudit.git .
          fi

          # PRESERVAR source/.env antes do git reset
          if [ -f "source/.env" ]; then
            cp source/.env /var/www/audit/.env.backup
          fi

          git config --global --add safe.directory /var/www/audit/app
          git fetch origin main
          git reset --hard origin/main

          # RESTAURAR source/.env apos git reset
          if [ -f "/var/www/audit/.env.backup" ]; then
            cp /var/www/audit/.env.backup source/.env
          fi

          if [ -f "deploy.sh" ]; then
            cp deploy.sh /var/www/audit/deploy.sh
            chmod +x /var/www/audit/deploy.sh
          fi

          if [ -f "/var/www/audit/deploy.sh" ]; then
            bash /var/www/audit/deploy.sh
          else
            echo "ERRO: deploy.sh nao encontrado!"
            exit 1
          fi
